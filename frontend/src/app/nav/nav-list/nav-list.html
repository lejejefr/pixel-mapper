<div class="nav-list">
  @for (element of nav.filteredElements(); track element.mapId) {
    <app-nav-list-element [props]="element"/>
    @if (nav.selectedId() === element.mapId) {
      <app-nav-description-container/>
    }
  }
  @if (nav.filteredElements().length === 0) {
    <div class="nav-list-empty">Aucune carte ne correspond à votre recherche.</div>
  }
</div>
