<form (ngSubmit)="onSubmit()" #form="ngForm">
  <h1>Créer une nouvelle map</h1>

  <div class="field">
    <label for="title">Titre</label>
    <textarea
      id="title"
      name="title"
      placeholder="Titre…"
      maxlength="128"
      [(ngModel)]="title"
      required
    ></textarea>
  </div>

  <div class="field">
    <label for="description">Description</label>
    <textarea
      id="description"
      name="description"
      placeholder="Description…"
      maxlength="512"
      [(ngModel)]="description"
    ></textarea>
  </div>

  <div class="dimensions">
    <div class="field">
      <label for="width">Largeur</label>
      <input
        id="width"
        name="width"
        type="number"
        min="1"
        max="999"
        step="1"
        [(ngModel)]="width"
        required
      />
    </div>

    <div class="field">
      <label for="height">Hauteur</label>
      <input
        id="height"
        name="height"
        type="number"
        min="1"
        max="999"
        step="1"
        [(ngModel)]="height"
        required
      />
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid">
    Commencer à éditer
  </button>
</form>
