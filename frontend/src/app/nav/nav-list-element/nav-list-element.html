<button
  type="button"
  class="nav-list-element"
  [class.selected]="isSelected()"
  (click)="onClick()"
>
  <div class="nav-list-element-title">{{ props.title }}</div>
  <div class="nav-list-element-dates">
    <span>{{ props.createdAt | date: "dd/MM/yyyy - HH:mm" }}</span>
    <span>{{ props.lastUpdate | date: "dd/MM/yyyy - HH:mm" }}</span>
  </div>
</button>
