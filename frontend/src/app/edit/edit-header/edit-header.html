<div class="edit-header">
  <button
  type="button"
  class="edit-header-icon" aria-label="Quitter la session"
  (click)="onExitPressed()">
    <img src="/exit-icon.svg" alt="EXIT" />
  </button>
  <button
  type="button"
  class="edit-header-icon" aria-label="Sauvegarder"
  (click)="onSavePressed()">
    <img src="/save-icon.svg" alt="SAVE" />
  </button>
  @for(icon of HEADER_ICON_RECORD; track icon.layer){
    <app-edit-header-icon
    [layer]="icon.layer"
    [ariaLabel]="icon.ariaLabel"
    [alt]="icon.alt"
    [icon]="icon.icon"></app-edit-header-icon>
  }
</div>
