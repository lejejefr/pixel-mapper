<div class="edit-window">
  <div class="layer"
  (mousedown)="onMouseDown($event)"
  (mouseup)="onMouseUp($event)"
  (mouseleave)="onMouseLeave()"
  (mouseenter)="onMouseEnter()"
  (mousemove)="onMouseMove($event)"
  (wheel)="onWheel($event)"
  >
  <!--
  <div>isMouseInWindow : {{controller.isMouseInWindow()}}</div>
  <div>isLeftClickPressed : {{controller.isLeftClickPressed()}}</div>
  <div>isRightClickPressed : {{controller.isRightClickPressed()}}</div>
  <div>isWheelClickPressed : {{controller.isWheelClickPressed()}}</div>
  <div>mouse x : {{controller.camLocation().x}}</div>
  <div>mouse y : {{controller.camLocation().y}}</div>
  <div>zoomValue: {{controller.zoomValue()}}</div>
  -->
  <app-edit-canvas
  class="edit-canvas"
  [layer]="'terrain'"
  [style.transform]="
    'translate(' + controller.camLocation().x + 'px,' +
                  controller.camLocation().y + 'px) scale(' +
                  controller.zoomValue() + ')'
  "
  />
  <app-edit-canvas
  class="edit-canvas"
  [layer]="'vegetation'"
  [style.transform]="
    'translate(' + controller.camLocation().x + 'px,' +
                  controller.camLocation().y + 'px) scale(' +
                  controller.zoomValue() + ')'
  "
  />
  <app-edit-canvas
  class="edit-canvas"
  [layer]="'roads'"
  [style.transform]="
    'translate(' + controller.camLocation().x + 'px,' +
                  controller.camLocation().y + 'px) scale(' +
                  controller.zoomValue() + ')'
  "
  />
  <app-edit-canvas
  class="edit-canvas"
  [layer]="'cities'"
  [style.transform]="
    'translate(' + controller.camLocation().x + 'px,' +
                  controller.camLocation().y + 'px) scale(' +
                  controller.zoomValue() + ')'
  "
  />

</div>
