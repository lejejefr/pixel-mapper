<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>PixelMapper</title>
  <style>
    :root {
      --bg-page: #0d0d10;
      --border: #2a2a33;
      --text-primary: #f2f2f5;
      --text-secondary: #a8a8b3;
      --accent-hover: #a78bfa;
    }

    html, body { margin: 0; height: 100%; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--bg-page);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;   /* la fenêtre sans cadre reste déplaçable */
      user-select: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin-bottom: 0.75rem;
      border: 3px solid var(--border);
      border-top-color: var(--accent-hover);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .title { font-size: 1.1rem; font-weight: 600; }
    .subtitle { font-size: 0.85rem; color: var(--text-secondary); }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="title">PixelMapper</div>
  <div class="subtitle">Démarrage…</div>
</body>
</html>
